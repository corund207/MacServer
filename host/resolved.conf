# MacServer DNS: /etc/systemd/resolved.conf.d/60-macserver.conf (installed by the host step).
#
# systemd-resolved answers this Mac's lookups on 127.0.0.53, and Docker forwards its
# containers' lookups there too. It asks the network's own DNS server and these public
# resolvers side by side, over TLS when a server offers it (opportunistic: encrypted,
# not authenticated), and it falls back to plain queries for a router that drops DNS
# queries carrying EDNS0. (The first MacServer's router did: tailscaled, which always
# sends EDNS0, could not look up Let's Encrypt, so the admin page had no certificate.)
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
DNSOverTLS=opportunistic
# No name lookups by broadcast on the local network: a server needs neither, and both
# would answer other machines on the Wi-Fi.
LLMNR=no
MulticastDNS=no
