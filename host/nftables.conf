#!/usr/sbin/nft -f
# MacServer host firewall. Only this table is replaced; Docker's and Tailscale's
# own tables are left alone (no "flush ruleset").
#
# Allowed in: loopback, replies to our own connections, everything arriving
# over Tailscale, Tailscale's direct-connection port, DHCP replies and ICMP.
# Everything else from the LAN or Internet is dropped.

table inet macserver
delete table inet macserver

table inet macserver {
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    iifname "tailscale0" accept
    # ICMP keeps the network working (errors, IPv6 neighbour discovery). Pings get an
    # answer, a flood of them does not.
    icmp type echo-request limit rate over 10/second burst 20 packets drop
    icmpv6 type echo-request limit rate over 10/second burst 20 packets drop
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport 41641 accept comment "Tailscale direct connections"
    udp sport 67 udp dport 68 accept comment "DHCPv4 replies"
    udp sport 547 udp dport 546 accept comment "DHCPv6 replies"
  }

  # Docker forwards published container ports around the input chain (DNAT), so a
  # container that listens on 0.0.0.0 would be open to the LAN. Never let a new
  # connection from the Wi-Fi, a cable or a phone reach a container, whatever
  # address it binds to. Runs just before Docker's own forward rules; containers'
  # own outgoing traffic and replies are untouched.
  chain forward {
    type filter hook forward priority filter - 1; policy accept;
    ct state established,related accept
    iifname "tailscale0" accept
    ct state new iifname "wl*" drop comment "Wi-Fi"
    ct state new iifname "en*" drop comment "Ethernet, USB and phone tethering"
    ct state new iifname "eth*" drop
    ct state new iifname "usb*" drop
    ct state new iifname "ww*" drop comment "mobile broadband"
  }
}
