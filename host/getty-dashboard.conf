# tty1 shows the MacServer dashboard instead of a login prompt. It logs in the
# unprivileged macserver-console account, whose only "shell" is the read-only
# dashboard. Log in for real on tty2 (press 2 on the dashboard; Ctrl + Option + 1 returns).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin macserver-console --noclear --noreset - ${TERM}
