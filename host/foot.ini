# foot, the terminal that shows the MacServer dashboard on the Mac's screen (tty1,
# inside the cage kiosk). The installer fills in the font size from
# DASHBOARD_FONT_PX in /etc/macserver/macserver.conf (default 18: about 232x64
# characters on the 2560x1600 panel; smaller = more detail).
[main]
font=JetBrains Mono:pixelsize=@FONT_PX@
dpi-aware=no
pad=0x0 center

[scrollback]
lines=0

[colors]
background=0b0e14
foreground=c9d1d9

[mouse]
hide-when-typing=yes

[key-bindings]
# The dashboard is read-only: no new terminals, no URL launching, no pasting.
spawn-terminal=none
show-urls-launch=none
show-urls-copy=none
show-urls-persistent=none
clipboard-paste=none
primary-paste=none
search-start=none
font-increase=none
font-decrease=none
font-reset=none

[mouse-bindings]
primary-paste=none
