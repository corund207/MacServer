# Candidate /etc/ssh/sshd_config.d/00-macserver.conf
# Validate effective settings with sshd -T; earlier values and Match blocks matter.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 30
