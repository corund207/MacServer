# MacServer USB installer boot menu.
set timeout=5
set default=0
insmod all_video
insmod gfxterm
insmod part_gpt
insmod iso9660
search --no-floppy --set=root --file /live/filesystem.squashfs
# A drive labelled MSANSWERS means a hands-off install (used by the CI test).
if search --no-floppy --set=answers --label MSANSWERS; then
  set default=2
  set timeout=1
fi

set t2opts="intel_iommu=on iommu=pt pcie_ports=compat"

menuentry "Install MacServer" {
  linux /live/vmlinuz boot=live quiet loglevel=3 $t2opts
  initrd /live/initrd.img
}
menuentry "Install MacServer (safe graphics)" {
  linux /live/vmlinuz boot=live nomodeset $t2opts
  initrd /live/initrd.img
}
menuentry "Install MacServer (hands-off, serial console)" {
  linux /live/vmlinuz boot=live $t2opts console=tty0 console=ttyS0,115200 macserver.auto=1
  initrd /live/initrd.img
}
