# Public API route: Cloudflare Tunnel -> Caddy path filter -> Supabase API gateway.
# No ports are published on the host. cloudflared only makes outbound connections.
name: macserver-gateway

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, /data, /config]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [supabase]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/macserver-health"]
      interval: 15s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      caddy:
        condition: service_healthy
    networks: [supabase]

networks:
  supabase:
    name: supabase_default
    external: true
