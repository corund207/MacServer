name: ci

on:
  push:
  pull_request:

# A newer push supersedes older runs on the same branch: Macs only install the newest
# commit, so finishing old runs would only delay it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notify-start:
    name: Send start notification
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send workflow start email
        uses: dawidd6/action-send-mail@v3
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cat <<EOF | sed 's/^/  /' > /tmp/email-body.txt
          MacServer CI Workflow Started
          =============================
          
          Build Information:
          - Workflow: CI (tests, shellcheck, firewall validation, gateway compose)
          - Commit: $SHA
          - Branch: $REF
          - Author: $ACTOR
          - Commit Message: $MSG
          - Build URL: https://github.com/$REPO/actions/runs/$RUN_ID
          
          Expected Duration: ~3-5 minutes
          
          Jobs:
          - checks: Shell syntax, ShellCheck, library & Python tests (110 tests)
          - Self-update CI gate test
          - Supabase pin validation
          - Firewall rules parse (nftables)
          - Gateway Compose validation
          - Gateway path filter test
          
          This workflow runs on every push and PR. Only pushes to main trigger the installer-image workflow.
          
          ---
          Automated notification from GitHub Actions
          EOF
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🚀 MacServer CI Started - ${{ github.sha }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: MacServer CI
          body: file:///tmp/email-body.txt

  checks:
    needs: notify-start
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Console font (the dashboard may only draw characters it has)
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q console-setup-linux
      - name: Shell syntax, ShellCheck, library and Python tests
        run: bash tests/run.sh
      - name: Self-update (CI gate, fast-forward only, rollback, off switch)
        run: sudo bash tests/self_update_test.sh
      - name: Supabase pin matches its tag
        run: |
          source installer/lib.sh
          actual=$(git ls-remote https://github.com/supabase/supabase.git "refs/tags/$SUPABASE_REF^{}" | cut -f1)
          echo "tag $SUPABASE_REF -> commit $actual, pinned $SUPABASE_COMMIT"
          test "$actual" = "$SUPABASE_COMMIT"
      - name: Firewall rules parse
        run: |
          sudo apt-get install -y -q nftables
          sudo nft -c -f host/nftables.conf
      - name: Gateway Compose file is valid
        env:
          TUNNEL_TOKEN: ci-placeholder
        run: docker compose -f gateway/compose.yml config --quiet
      - name: Gateway exposes only app API paths
        run: bash tests/gateway_test.sh

  notify-success:
    name: Send success notification
    needs: checks
    runs-on: ubuntu-24.04
    if: always() && needs.checks.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Send workflow success email
        uses: dawidd6/action-send-mail@v3
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cat <<EOF > /tmp/email-body.txt
          MacServer CI Workflow Passed
          =============================
          
          Build Information:
          - Workflow: CI
          - Commit: $SHA
          - Branch: $REF
          - Author: $ACTOR
          - Build URL: https://github.com/$REPO/actions/runs/$RUN_ID
          - Duration: ${{ github.run_started_at }} to completion
          
          All Checks Passed:
          ✅ Shell syntax & ShellCheck (0 issues)
          ✅ Library tests
          ✅ Python tests (110 tests)
          ✅ Self-update CI gate test
          ✅ Supabase pin validation
          ✅ Firewall rules parse (nftables)
          ✅ Gateway Compose validation
          ✅ Gateway path filter test
          
          Installed MacServers will now auto-update to this commit ($SHA) on their next 2-minute check cycle.
          
          ---
          Automated notification from GitHub Actions
          EOF
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ MacServer CI Passed - ${{ github.sha }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: MacServer CI
          body: file:///tmp/email-body.txt

  notify-failure:
    name: Send failure notification
    needs: checks
    runs-on: ubuntu-24.04
    if: always() && needs.checks.result != 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Send workflow failure email
        uses: dawidd6/action-send-mail@v3
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cat <<EOF > /tmp/email-body.txt
          MacServer CI Workflow FAILED
          ============================
          
          Build Information:
          - Workflow: CI
          - Commit: $SHA
          - Branch: $REF
          - Author: $ACTOR
          - Build URL: https://github.com/$REPO/actions/runs/$RUN_ID
          - Started: ${{ github.run_started_at }}
          
          ❌ One or more checks failed. Check the build log for details:
          https://github.com/$REPO/actions/runs/$RUN_ID
          
          Common Failure Points:
          - Shell syntax / ShellCheck
          - Python tests (110 tests)
          - Self-update CI gate test
          - Supabase pin validation (tag commit mismatch)
          - Firewall rules (nftables -c)
          - Gateway Compose / path filter test
          
          Installed MacServers will NOT update to this commit. They remain on the previous passing version.
          
          Action Required: Fix the failing checks and push a new commit.
          ---
          Automated notification from GitHub Actions
          EOF
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ MacServer CI Failed - ${{ github.sha }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: MacServer CI
          body: file:///tmp/email-body.txt
