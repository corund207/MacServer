name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Console font (the dashboard may only draw characters it has)
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q console-setup-linux
      - name: Shell syntax, ShellCheck, library and Python tests
        run: bash tests/run.sh
      - name: Self-update (CI gate, fast-forward only, rollback, off switch)
        run: sudo bash tests/self_update_test.sh
      - name: Supabase pin matches its tag
        run: |
          source installer/lib.sh
          actual=$(git ls-remote https://github.com/supabase/supabase.git "refs/tags/$SUPABASE_REF^{}" | cut -f1)
          echo "tag $SUPABASE_REF -> commit $actual, pinned $SUPABASE_COMMIT"
          test "$actual" = "$SUPABASE_COMMIT"
      - name: Firewall rules parse
        run: |
          sudo apt-get install -y -q nftables
          sudo nft -c -f host/nftables.conf
      - name: Gateway Compose file is valid
        env:
          TUNNEL_TOKEN: ci-placeholder
        run: docker compose -f gateway/compose.yml config --quiet
      - name: Gateway exposes only app API paths
        run: bash tests/gateway_test.sh
