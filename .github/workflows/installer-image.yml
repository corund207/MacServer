name: installer-image

# Fast path first: the disk installer is tested directly on a loop device (~10 min)
# while the image is assembled from a cached base. The VM test boots the kernel
# directly and fails within minutes if a step stalls. Release tags also boot the
# image through its own UEFI menu. It runs for every commit on main: installed Macs
# update themselves only to commits where this workflow and ci have passed.

on:
  workflow_dispatch:
  push:
    branches: [main, usb-installer]
    tags: ['v*']

# A newer push supersedes older runs on the same branch: Macs only install the newest
# commit, so finishing old runs would only delay it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  notify-start:
    name: Send start notification
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create start email body
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cat <<EOF > /tmp/email-body.txt
          MacServer Installer Image Build Started
          =======================================
          
          Build Information:
          - Workflow: installer-image (disk install, image build, VM test)
          - Commit: $SHA
          - Branch: $REF
          - Author: $ACTOR
          - Commit Message: $MSG
          - Build URL: https://github.com/$REPO/actions/runs/$RUN_ID
          
          Expected Duration: ~10-15 minutes total
          
          Jobs (sequential):
          1. disk-install (~3 min): Hands-off install onto loop device, 22 property checks
          2. image (~30 s with cache, ~3 min cold): Assembles bootable UEFI ISO from cached base
          3. vm-test (~4 min): QEMU/KVM install from ISO, UEFI boot, first-boot preflight + network
          4. release (tags only): Publishes ISO as GitHub release with SHA256
          
          This workflow runs on every push to main and usb-installer branch, and on version tags (v*).
          Installed MacServers only update to commits where BOTH this workflow AND ci have passed.
          
          ---
          Automated notification from GitHub Actions
          EOF
      - name: Send workflow start email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🏗️ MacServer Installer Image Build Started - ${{ github.sha }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: MacServer CI
          body: file:///tmp/email-body.txt

  disk-install:
    needs: notify-start
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install hands-off onto a loop device and inspect the result
        run: sudo bash tests/setup_disk_test.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: disk-install-log
          path: build/macserver-setup.log
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Base image cache key
        id: base
        run: |
          sum=$({ find iso/base -type f | sort | xargs cat; cat host/t2.sources host/t2.pref; grep "^T2_KEY_FPR=" installer/lib.sh; } | sha256sum | cut -c1-16)
          # v2: bases that carry build/base/inputs.sum (older cached bases were rebuilt every run)
          echo "key=macserver-base-v2-$sum-$(date -u +%G-w%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/base
          key: ${{ steps.base.outputs.key }}
      - name: Assemble the image (builds the base only on a cache miss)
        run: bash iso/build.sh "${GITHUB_REF_NAME//\//-}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macserver-iso
          path: build/macserver-*.iso*
          if-no-files-found: error
          retention-days: 14

  vm-test:
    needs: [disk-install, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macserver-iso
          path: build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf mtools dosfstools xorriso
      - name: Install from the image in a VM, then boot the result
        env:
          FULL_UEFI: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: bash tests/iso_install_test.sh build/macserver-*.iso
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vm-test-logs
          path: build/*.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: vm-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macserver-iso
          path: build
      - name: Publish the image as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/macserver-*.iso build/macserver-*.iso.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "MacServer $GITHUB_REF_NAME" \
            --notes "USB installer for the 2019 MacBook Air (T2). Write the .iso to a USB stick, then follow the README."

  notify-success:
    name: Send success notification
    needs: [disk-install, image, vm-test, release]
    runs-on: ubuntu-24.04
    if: always() && (needs.disk-install.result == 'success' && needs.image.result == 'success' && needs.vm-test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')) && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Create success email body
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cat <<EOF > /tmp/email-body.txt
          MacServer Installer Image Build PASSED
          ======================================
          
          Build Information:
          - Workflow: installer-image
          - Commit: $SHA
          - Branch: $REF
          - Author: $ACTOR
          - Build URL: https://github.com/$REPO/actions/runs/$RUN_ID
          - Started: ${{ github.run_started_at }}
          
          All Jobs Passed:
          ✅ disk-install (~3 min): Hands-off install to loop device, 22 property checks
          ✅ image (~30s cached / ~3 min cold): Bootable UEFI ISO assembled
          ✅ vm-test (~4 min): QEMU install from ISO, UEFI boot, first-boot preflight + network
          ✅ release: ISO published as GitHub release (tags only)
          
          ISO Artifact: Available for 14 days at the build page
          SHA256: Check build/macserver-*.iso.sha256 in artifacts
          
          Installed MacServers will now auto-update to this commit ($SHA) on their next 2-minute check cycle (requires CI to also pass).
          
          ---
          Automated notification from GitHub Actions
          EOF
      - name: Send workflow success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ MacServer Installer Image Build Passed - ${{ github.sha }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: MacServer CI
          body: file:///tmp/email-body.txt

  notify-failure:
    name: Send failure notification
    needs: [disk-install, image, vm-test, release]
    runs-on: ubuntu-24.04
    if: always() && (needs.disk-install.result != 'success' || needs.image.result != 'success' || needs.vm-test.result != 'success' || needs.release.result == 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Create failure email body
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cat <<EOF > /tmp/email-body.txt
          MacServer Installer Image Build FAILED
          ======================================
          
          Build Information:
          - Workflow: installer-image
          - Commit: $SHA
          - Branch: $REF
          - Author: $ACTOR
          - Build URL: https://github.com/$REPO/actions/runs/$RUN_ID
          - Started: ${{ github.run_started_at }}
          
          ❌ One or more jobs failed. Check the build log:
          https://github.com/$REPO/actions/runs/$RUN_ID
          
          Job Status:
          - disk-install: ${{ needs.disk-install.result }}
          - image: ${{ needs.image.result }}
          - vm-test: ${{ needs.vm-test.result }}
          - release: ${{ needs.release.result }}
          
          Common Failure Points:
          - disk-install: LUKS2 setup, T2 kernel initrd, GRUB config, first-boot unit
          - image: Base cache miss (rebuilds base ~3 min), squashfs, GRUB EFI
          - vm-test: QEMU KVM, OVMF UEFI, ISO boot, installer answers, first-boot
          - release: Only runs on tags (v*)
          
          Installed MacServers will NOT update to this commit. They remain on the previous passing version.
          
          Action Required: Check job logs, fix the issue, push a new commit.
          ---
          Automated notification from GitHub Actions
          EOF
      - name: Send workflow failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ MacServer Installer Image Build Failed - ${{ github.sha }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: MacServer CI
          body: file:///tmp/email-body.txt
