name: installer-image

on:
  workflow_dispatch:
  push:
    branches: [main, usb-installer]
    tags: ['v*']
    paths: ['iso/**', 'installer/**', 'host/**', 'install.sh', 'tests/iso_install_test.sh', 'tests/qemu_serial.py', '.github/workflows/installer-image.yml']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the installer image
        run: bash iso/build.sh "${GITHUB_REF_NAME//\//-}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macserver-iso
          path: build/macserver-*.iso*
          if-no-files-found: error
          retention-days: 14

  install-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macserver-iso
          path: build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf mtools dosfstools
      - name: Install from the image in a VM, then boot the result
        run: bash tests/iso_install_test.sh build/macserver-*.iso
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-test-logs
          path: build/*.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macserver-iso
          path: build
      - name: Publish the image as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/macserver-*.iso build/macserver-*.iso.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "MacServer $GITHUB_REF_NAME" \
            --notes "USB installer for the 2019 MacBook Air (T2). Write the .iso to a USB stick, then follow the README."
