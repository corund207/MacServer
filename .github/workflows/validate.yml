name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  project-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --detach --network none --name macserver-schema-test --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17.9-alpine@sha256:e19c5d72436d4d2f54d00c789775095d02a5dfb1c0f7ea5a243230b1bb46c2bb
      - name: Wait for isolated fixture
        run: |
          for attempt in $(seq 1 30); do
            if docker exec macserver-schema-test pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python3 scripts/test_project_sql.py
  ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - run: node --test apps/ingress/test/*.test.mjs
      - run: docker compose -f infra/ingress/compose.json config --quiet
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
      - run: python3 scripts/validate_admin_unit.py
      - run: python3 scripts/validate_dashboard_units.py
      - run: python3 scripts/validate_backup_units.py
      - run: python3 scripts/validate_deploy_unit.py
      - run: python3 scripts/security_posture.py
      - run: python3 -m unittest discover -s tests -v
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:ui
      - run: npm audit --omit=dev
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev
